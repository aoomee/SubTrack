<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/subtrack-mark.svg?v=clover" />
    <meta name="theme-color" content="#fcfcfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A personal subscription management tool to track and manage all your recurring payments in one place" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' http://localhost:3001 https://localhost:3001; font-src 'self';">
    <title>SubTrack</title>
    <!-- Add inline styles for the preloader -->
    <style>
      .app-preloader {
        position: fixed;
        inset: 0;
        background-color: hsl(60 14% 99%);
        color: hsl(240 6% 10%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
        transition: opacity 180ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .app-preloader.is-hiding {
        opacity: 0;
        pointer-events: none;
      }
      .dark .app-preloader {
        background-color: hsl(240 6% 6%);
        color: hsl(240 5% 96%);
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 2.5px solid hsl(240 6% 10% / 0.14);
        border-top-color: hsl(240 6% 10%);
        border-radius: 50%;
        animation: spin 0.85s linear infinite;
      }
      .dark .spinner {
        border-color: hsl(240 5% 96% / 0.16);
        border-top-color: hsl(240 5% 96%);
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .app-preloader-error {
        margin-top: 16px;
        padding: 12px 16px;
        background-color: hsl(0 65% 46% / 0.1);
        border: 1px solid hsl(0 65% 46% / 0.2);
        border-radius: 12px;
        max-width: 80%;
        font-size: 13px;
        color: hsl(0 65% 46%);
        display: none;
      }
      .dark .app-preloader-error {
        background-color: hsl(0 65% 66% / 0.12);
        border: 1px solid hsl(0 65% 66% / 0.22);
        color: hsl(0 65% 66%);
      }
      @media (prefers-reduced-motion: reduce) {
        .app-preloader { transition: none; }
      }
    </style>
    <script>
      // Check preferred color scheme for preloader
      if (localStorage.getItem('vite-ui-theme') === 'dark' ||
          ((!localStorage.getItem('vite-ui-theme') || localStorage.getItem('vite-ui-theme') === 'system') &&
           window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <!-- Preloader that shows before React loads -->
    <div id="app-preloader" class="app-preloader">
      <div class="spinner"></div>
      <div id="app-preloader-error" class="app-preloader-error"></div>
    </div>

    <div id="root"></div>

    <script>
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var preloader = document.getElementById('app-preloader');
          if (preloader && !preloader.classList.contains('is-hiding') && preloader.style.display !== 'none') {
            var errorElement = document.getElementById('app-preloader-error');
            if (errorElement) {
              errorElement.style.display = 'block';
              errorElement.textContent = 'Application is taking longer than expected to load. Please refresh the page.';
            }
          }
        }, 6000);
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Fallback dismiss if main.tsx didn't dismiss preloader yet
      window.addEventListener('load', function() {
        var preloader = document.getElementById('app-preloader');
        if (preloader && !preloader.classList.contains('is-hiding')) {
          preloader.classList.add('is-hiding');
          setTimeout(function() { preloader.remove(); }, 200);
        }
      });
    </script>
  </body>
</html>
