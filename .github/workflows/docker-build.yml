name: Build and Push Docker Image

on:
  push:
    branches: [ main, master ]
    tags: ['v*']
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm test && npm run lint

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Test backend
        working-directory: server
        run: npm test -- --runInBand

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-architecture)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Build a native image first so every event verifies that the final
      # container can actually start and serve both the UI and API.
      - name: Build image for runtime smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: subtrack:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        shell: bash
        run: |
          set -euo pipefail

          container_id="$(docker run --detach --rm \
            --publish 127.0.0.1:3001:3001 \
            --env SESSION_SECRET=ci-only-session-secret-with-at-least-48-characters \
            --env ADMIN_USERNAME=admin \
            --env ADMIN_PASSWORD=SmokeTest123 \
            subtrack:smoke)"

          cleanup() {
            docker logs "$container_id" || true
            docker stop "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if ! docker inspect "$container_id" >/dev/null 2>&1; then
              echo "Container exited before becoming ready"
              exit 1
            fi

            root_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3001/ || true)"
            health_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3001/api/health || true)"

            if [[ "$root_status" == "200" && "$health_status" == "401" ]]; then
              echo "Container smoke test passed"
              exit 0
            fi

            sleep 1
          done

          echo "Container did not become healthy in time"
          exit 1

      # Non-PR: Login + multi-architecture push only after the runtime smoke test.
      - name: Login to container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
